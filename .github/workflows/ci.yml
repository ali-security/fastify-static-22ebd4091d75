name: CI

on:
  workflow_dispatch:

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
    cancel-in-progress: true

permissions:
  contents: read

env:
  # Resolve dependencies as they were at the 8.3.0 release (2025-10-17), which is
  # the dependency set upstream's CI actually validated. Unpinned, `npm i` drifts
  # (e.g. fastify 5.6.1 -> 5.11.x) and the drifted tree hangs the suite.
  NPM_CONFIG_REGISTRY: https://:2025-10-17T16%3A23%3A14.459Z@time-machines-npm.sealsecurity.io/

# The jobs below are fastify/workflows/.github/workflows/plugins-ci.yml@v5 (and the
# nested-quality.yml it calls) inlined verbatim: a caller job that uses a reusable
# workflow cannot declare `timeout-minutes`, which this build requires.
# license-check: true and lint: true are the inputs ci.yml passed upstream.
jobs:
  license-check:
    name: Check Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Check Licenses
        run: npx license-checker --production --summary --onlyAllow="0BSD;Apache-2.0;BlueOak-1.0.0;BSD-2-Clause;BSD-3-Clause;ISC;MIT;"

  linter:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: lts/*

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Lint code
        run: npm run lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The suite starts servers on port 0 and fetches http://localhost:<port>.
      # When the connect side resolves localhost to ::1 while the server is
      # reachable on 127.0.0.1, the fetch stalls and borp cancels the whole
      # test file on its 30s timeout. Pinning IPv4-first keeps both sides on
      # the same loopback family; every test still runs.
      NODE_OPTIONS: --dns-result-order=ipv4first
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Run tests
        run: npm test

  pack:
    name: Pack release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Pack
        run: |
          npm pack
          mv fastify-static-8.3.0.tgz static-8.3.0.tgz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: static-8.3.0.tgz
          if-no-files-found: error
